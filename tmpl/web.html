<script>document.documentElement.classList.add('lookB')</script>
<div id="app">
  <section id="s-title" class="screen"></section>
  <section id="s-game" class="screen" hidden>
    <canvas id="cv" class="px"></canvas>
    <div id="top">
      <div class="tbar"><button id="bMenu" class="tb" aria-label="메뉴">☰<span>부대</span></button><div class="zn"><span class="znl"><b id="zName"></b><span id="zCal" class="zcal" hidden><i class="sea" aria-hidden="true"></i><span class="zct"></span></span></span><small id="zSub"></small></div><span class="cur"><i class="coin"></i><b id="gold" class="num">0</b></span><button id="bMap" class="tb">지도</button></div>
      <div id="chips"></div>
      <button id="quest"></button>
      <div id="boss" hidden><b></b><em></em><i class="bbar"><u></u></i></div>
    </div>
    <div id="banner"></div>
    <div id="mourn"></div>
    <div id="toast" role="status"></div>
    <div id="bot" class="dock">
      <div id="info"><span id="selCtx"><span id="selCrest"></span><b id="selName"></b></span><span id="infoText"></span><span class="tick"><i>틱</i><span id="tick"><u></u></span><b id="tickN" class="num">100</b></span></div>
      <div id="acts"></div>
      <div id="sys"><button id="bHunt" class="sy"><b>전체 자동</b><small>꺼짐</small></button><button id="bSpeed" class="sy"><b>1×</b><small>속도</small></button><button id="bPause" class="sy"><b>Ⅱ</b><small>멈춤</small></button></div>
    </div>
    <div id="selPop" class="spop" hidden role="dialog" aria-label="고른 가문 지휘"><div class="sph"><span id="spCrest"></span><b id="spName"></b><small id="spWho"></small><button id="spX" class="spx" aria-label="닫기">✕</button></div><div id="selSeg" role="group" aria-label="고른 가문"><button id="bAutoU" class="sy"><span class="lb">조작</span><b>자동</b><small>알아서 싸운다</small></button></div><p class="spn">위 초상을 누르면 다른 가문을 고른다</p></div>
  </section>
</div>
<script>@JS@</script>
</body></html>
